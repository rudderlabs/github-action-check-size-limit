name: "test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: 'Unit Tests'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: |
          npm run setup:ci

      - name: Execute unit tests
        run: |
          npm run test

  verify-dist:
    name: 'Bundle is up to date'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: |
          npm run setup:ci

      # action.yml runs dist/index.js directly and the bundle is committed, so a
      # tag is only correct if dist was rebuilt from src before the release
      # commit. release-please tags on merge and its Release PR touches only the
      # version and changelog, so without this a stale bundle would ship under a
      # tag that claims to contain the source beside it.
      - name: Rebuild the bundle
        run: |
          npm run build

      - name: Fail if dist is out of date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ does not match src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

          echo "dist/ is up to date"
